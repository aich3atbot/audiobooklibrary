name: Docker

on:
  push:
    branches: [master]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Both architectures run the suite. arm64 is not a formality here: the wheels
  # are different builds (pydantic-core, greenlet, uvloop, watchfiles...) and
  # mutagen's parsers plus the hand-written MP4 box readers are the code most
  # likely to notice a different machine.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest

  # One job per architecture, each building natively on its own runner: no
  # QEMU. Emulating the ffmpeg stage costs 15-45 minutes; built natively it is
  # a couple of minutes, and standard runners (arm64 included) are free and
  # unlimited on public repositories.
  #
  # Each job pushes an *untagged* image, addressed only by digest, and the
  # merge job below stitches the digests into one multi-arch manifest and
  # applies the tags. That is why the tag rules live in `merge` and not here.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: x86_64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Name this platform for cache scopes and artifacts
        run: echo "PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Labels only: this image carries no tags of its own.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per platform: a shared scope has both jobs writing the same
          # cache concurrently, and they evict each other's ffmpeg layer --
          # the one layer worth caching.
          cache-from: type=gha,scope=${{ env.PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PAIR }}

      # The suite mocks ffmpeg, so this is the only thing that runs the binary
      # we ship. It matters most on arm64, where nothing else proves the
      # cross-architecture build produced a working encoder. anullsrc as a
      # filter source means no fixture file is needed, and every step exercises
      # a configure flag the transcoder depends on: the anullsrc/atrim filters,
      # the aac encoder, the ipod muxer. Reading the result back through the
      # app's own identify() covers mutagen and the MP4 box reader too.
      - name: Smoke-test the image we just pushed
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          WANT_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --env WANT_ARCH "$REF" sh -euc '
            ffmpeg -hide_banner -v error \
              -filter_complex "anullsrc=r=44100:cl=mono,atrim=duration=1[a]" \
              -map "[a]" -c:a aac -f ipod -y /tmp/smoke.m4b
            python - <<PY
          import os, platform
          from pathlib import Path
          from app.services.audio_format import identify, has_video_track

          machine = platform.machine()
          want = os.environ["WANT_ARCH"]
          assert machine == want, f"image is {machine}, expected {want}"

          fmt = identify(Path("/tmp/smoke.m4b"))
          assert fmt is not None, "ffmpeg output did not parse as audio"
          assert fmt.family == "mp4", f"expected mp4, got {fmt.family}"
          # AAC encoder priming puts the reference encode at 1.023s.
          assert 0.9 <= fmt.parsed.info.length <= 1.2, fmt.parsed.info.length
          assert not has_video_track(Path("/tmp/smoke.m4b"))
          print(f"{machine}: ffmpeg encode read back as {fmt.family}, {fmt.parsed.info.length:.3f}s")
          PY
          '

      - name: Export the digest for the merge job
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # master push -> :testing; tag push vX.Y.Z -> :X.Y.Z plus :latest
  # (the default latest=auto flavor adds :latest on semver tag events).
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=testing,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
      - name: Create the multi-arch manifest and tag it
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Inspect the published manifest
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
