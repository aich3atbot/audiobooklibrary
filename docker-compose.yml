services:
  audiobooklibrary:
    build: .
    container_name: audiobooklibrary
    # Run as this uid:gid so files the app writes (config DB, imported
    # audiobooks) are owned by it on the host. The mounted dirs must be
    # writable by this user.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8000:8000"
    environment:
      # Optional variables are listed bare: one that is set in .env (or the
      # shell) is passed through, and one that is not never reaches the
      # container at all, so app/config.py applies its own default. Defaults
      # live there and nowhere else — write VAR=value here only to force one.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set in .env}
      - INDEX_URL
      - DOWNLOAD_CLIENT
      - DOWNLOAD_URL
      - DOWNLOAD_USERNAME
      - DOWNLOAD_PASSWORD
      - DOWNLOAD_LABEL
      - DOWNLOAD_REMOVE_IMMEDIATELY
      - SYNC_INTERVAL_MINUTES
      - WATCH_INTERVAL_SECONDS
      - DOWNLOAD_QUIET_SECONDS
      - IMPORT_MODE
      - MARK_READING_AFTER_MINUTES
      - MARK_READ_TAIL_MINUTES
      - TRANSCODE_BITRATE
      - FFMPEG_PATH
    volumes:
      # Bind-mount sources: only compose can default a host path, and a wrong
      # guess would silently write the library somewhere else, so they are
      # required rather than defaulted.
      - ${CONFIG_DIR:?set in .env}:/config
      # Must be the directory Deluge writes *completed* downloads to — if Deluge
      # saves to /downloads/complete, mount that path here, not its parent.
      - ${DOWNLOAD_DIR:?set in .env}:/downloads
      - ${LIBRARY_DIR:?set in .env}:/audiobooks
      - ${IMPORTS_DIR:?set in .env}:/imports
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

