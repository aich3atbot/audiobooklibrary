services:
  audiobooklibrary:
    build: .
    container_name: audiobooklibrary
    ports:
      - "8000:8000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
      INDEX_URL: ${INDEX_URL:?set in .env}
      DOWNLOAD_CLIENT: ${DOWNLOAD_CLIENT:-}
      DOWNLOAD_URL: ${DOWNLOAD_URL:-}
      DOWNLOAD_USERNAME: ${DOWNLOAD_USERNAME:-}
      DOWNLOAD_PASSWORD: ${DOWNLOAD_PASSWORD:-}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-30}
      WATCH_INTERVAL_SECONDS: ${WATCH_INTERVAL_SECONDS:-30}
      DOWNLOAD_QUIET_SECONDS: ${DOWNLOAD_QUIET_SECONDS:-120}
      IMPORT_MODE: ${IMPORT_MODE:-copy}
    volumes:
      - ${CONFIG_DIR}:/config
      # Must be the directory Deluge writes *completed* downloads to — if Deluge
      # saves to /downloads/complete, mount that path here, not its parent.
      - ${DOWNLOAD_DIR}:/downloads
      - ${LIBRARY_DIR}:/audiobooks
      - ${IMPORTS_DIR}:/imports
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

