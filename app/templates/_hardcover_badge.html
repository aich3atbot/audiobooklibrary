{# Badge linking out to hardcover.app. The site routes on slugs, not ids, so
   callers must guard on the slug being known (NULL until the sync backfill
   has seen the row). #}
{% macro hardcover_badge(path, slug, label) %}
<a class="badge" href="https://hardcover.app/{{ path }}/{{ slug }}"
   target="_blank" rel="noopener" title="Open on Hardcover">
    <svg class="badge-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 4.3C6.8 3.2 5.1 2.7 2.8 2.9v8.9c2.3-.2 4 .3 5.2 1.3 1.2-1 2.9-1.5 5.2-1.3V2.9c-2.3-.2-4 .3-5.2 1.4zm0 0v9"
              fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
    </svg> {{ label }}
</a>
{% endmacro %}
