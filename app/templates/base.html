<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Audiobook Library{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2/dist/htmx.min.js" defer></script>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
    <nav class="container">
        <ul>
            <li><strong>📚 Audiobook Library</strong></li>
        </ul>
        <ul>
            {% if request.state.is_admin %}
            <li><a href="/admin/users">Users</a></li>
            {% elif request.state.username %}
            <li><a href="/">Library</a></li>
            <li><a href="/search">Search</a></li>
            <li><a href="/imports">Imports</a></li>
            <li><a href="/activity">Activity</a></li>
            <li><a href="/settings">Settings</a></li>
            {% endif %}
            {% if request.state.username %}
            <li>
                <form method="post" action="/logout" class="logout-form">
                    <button type="submit" class="secondary outline">
                        Log out ({{ request.state.username }})
                    </button>
                </form>
            </li>
            {% endif %}
        </ul>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <div id="modal"></div>
</body>
</html>
